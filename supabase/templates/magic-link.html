<!doctype html>
<html lang="en">
  <body
    style="
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 32px;
      background: #faf7f2;
    "
  >
    <div
      style="
        max-width: 480px;
        margin: 0 auto;
        padding: 32px;
        background: #ffffff;
        border-radius: 12px;
      "
    >
      <h1 style="margin-top: 0; font-size: 20px;">Chocolate Zone admin</h1>
      <p>Use the link below to sign in to your shop's admin dashboard.</p>
      <p>
        <a
          href="{{ .ConfirmationURL }}"
          style="
            display: inline-block;
            padding: 12px 20px;
            background: #7a3b2e;
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
          "
        >
          Sign in to Chocolate Zone
        </a>
      </p>
      <p style="color: #666666; font-size: 13px">
        This link is one-time use and expires after 30 minutes. If you did not request it, you can
        safely ignore this email.
      </p>
    </div>
  </body>
</html>
